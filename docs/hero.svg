<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Mixer keyboard: glide typing in English and Bangla">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A16"/>
      <stop offset="1" stop-color="#13171B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3DDC97"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      .k { font: 500 22px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #F1F3F5; text-anchor: middle; }
      .s { font: 500 17px 'Segoe UI', Roboto, Arial, sans-serif; fill: #8D969E; text-anchor: middle; }
      .title { font: 800 104px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #F1F3F5; letter-spacing: -3px; }
      .tag { font: 500 30px 'Segoe UI', Roboto, Arial, 'Noto Sans Bengali', 'Nirmala UI', 'Vrinda', sans-serif; fill: #C9D1D9; }
      .small { font: 500 20px 'Segoe UI', Roboto, Arial, sans-serif; fill: #8D969E; }
      .chip { font: 600 26px 'Segoe UI', Roboto, Arial, 'Noto Sans Bengali', 'Nirmala UI', 'Vrinda', sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

