    <path d="M14 238h8v8h-8zM26 238h8v8h-8zM38 238h8v8h-8zM50 238h8v8h-8z M20 214h28v4h-11v8a7 7 0 1 1 -4 0v-8h-13z" fill="#fff"/>
    <text x="0" y="370" class="title">Mixer</text>
    <text x="4" y="428" class="tag">Glide in English. Glide in বাংলা.</text>
    <text x="4" y="474" class="small">Avro phonetic · long-press C to copy, V to paste</text>
    <text x="4" y="506" class="small">2.5 MB · works offline · no internet permission</text>
  </g>

